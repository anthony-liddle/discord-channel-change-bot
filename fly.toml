# Fly.io configuration for the theme bot.
#
# This is a worker, not a website. It opens an outbound gateway connection to
# Discord and listens on no port.
#
# DO NOT ADD AN [http_service] BLOCK. `fly launch` adds one automatically and it
# has to be removed. With a service defined, Fly idles the machine when no HTTP
# requests arrive, and no HTTP request will ever arrive here, so the machine
# stops and the weekly rotation silently never fires. Its internal_port also
# points health checks at a port nothing is listening on. With no services
# defined, Fly has nothing to idle and the machine runs continuously.

app = 'pnwkc-theme-bot'
primary_region = 'sjc'

[build]

[env]
  # Must match the mount destination below. Without this the bot writes its
  # state into the application directory, which Fly rebuilds on every deploy.
  DATA_DIR = '/data'
  # Log timestamps only. The rotation schedule comes from the timezone field in
  # config.json, not from here.
  TZ = 'UTC'

# The volume must live in the same region as the machine, so it is created with
# `fly volumes create theme_bot_data --size 1 --region sjc`.
[[mounts]]
  source = 'theme_bot_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1

# Never run more than one machine. Two instances would both fire the weekly
# cron, so the channel would be renamed twice and the announcement posted
# twice. Check with `fly status` and correct with `fly scale count 1`.
